# Ashen Oath — APK Android arm64-v8a (Release) via .NET Android.
# Dijalankan manual dari tab GitHub Actions (workflow_dispatch).
# Pipeline: toolchain -> SDL2/SDL2_image/SDL2_mixer (arm64-v8a, dibangun dari
# upstream) -> publish Android Release -> validasi APK -> artifact.
# Tanpa secret/keystore pribadi (debug-signed), tanpa path Termux, tanpa ADB.
name: Android APK (arm64-v8a)

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform 35 + build-tools + NDK r28c
        run: |
          set -euo pipefail
          sdkmanager --version
          java -version
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;r28c"

      - name: Export ANDROID_SDK_ROOT + ANDROID_NDK_HOME
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          NDK_DIR="$(ls -d "${ANDROID_HOME}"/ndk/* | sort -V | tail -n 1)"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
          echo "ANDROID_NDK_HOME=${NDK_DIR}"
          ls "${NDK_DIR}/build/cmake/android.toolchain.cmake"

      - name: Cache SDL2 source tarball
        uses: actions/cache@v4
        with:
          path: .sdl-cache
          key: sdl2-2.32.10

      - name: Build libSDL2.so (arm64-v8a, API 21)
        run: bash scripts/android/build-sdl2.sh

      - name: Cache SDL2_image source tarball
        uses: actions/cache@v4
        with:
          path: .sdl-cache
          key: sdl2-image-2.8.12

      - name: Build libSDL2_image.so (arm64-v8a, API 21, PNG)
        run: bash scripts/android/build-sdl2-image.sh

      - name: Cache SDL2_mixer source tarball
        uses: actions/cache@v4
        with:
          path: .sdl-cache
          key: sdl2-mixer-2.8.2

      - name: Build libSDL2_mixer.so (arm64-v8a, API 21, WAV+OGG)
        run: bash scripts/android/build-sdl2-mixer.sh

      - name: Restore Android project
        run: dotnet restore Ashen_Oath.Android/Ashen_Oath.Android.csproj

      - name: Publish Android Release (arm64-v8a)
        run: >
          dotnet publish Ashen_Oath.Android/Ashen_Oath.Android.csproj
          -c Release
          --no-restore

      - name: Locate APK (exactly one Signed APK)
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find Ashen_Oath.Android/bin/Release/net9.0-android/publish -maxdepth 1 -type f -name '*-Signed.apk' | sort)
          echo "found: ${APKS[*]:-<none>}"
          [ "${#APKS[@]}" -eq 1 ] || { echo "ERROR: harus tepat satu *-Signed.apk." >&2; exit 1; }
          echo "APK=${APKS[0]}" >> "${GITHUB_ENV}"
          ls -lh "${APKS[0]}"

      - name: Inspect APK contents (libs + classes, no libmain)
        run: |
          set -euo pipefail
          unzip -l "${APK}"
          for lib in libSDL2.so libSDL2_image.so libSDL2_mixer.so; do
            unzip -l "${APK}" | grep -q "lib/arm64-v8a/${lib}" \
              || { echo "ERROR: ${lib} tidak ada di lib/arm64-v8a/." >&2; exit 1; }
          done
          if unzip -l "${APK}" | grep -q 'libmain\.so'; then
            echo "ERROR: libmain.so tak terduga di APK (arsitektur memakai managed entry, bukan native main)." >&2
            exit 1
          fi
          unzip -l "${APK}" | grep -q 'classes.dex' \
            || { echo "ERROR: classes.dex tidak ada." >&2; exit 1; }

      - name: Validate APK zip + native libs
        run: |
          set -euo pipefail
          unzip -t "${APK}"
          mkdir -p /tmp/ashen-apk-check
          for lib in libSDL2.so libSDL2_image.so libSDL2_mixer.so; do
            unzip -p "${APK}" "lib/arm64-v8a/${lib}" > "/tmp/ashen-apk-check/${lib}"
            file "/tmp/ashen-apk-check/${lib}"
            readelf -h "/tmp/ashen-apk-check/${lib}" | grep -E 'Class|Machine'
            readelf -d "/tmp/ashen-apk-check/${lib}" | grep -E 'NEEDED|SONAME' || true
          done

      - name: Verify package + launcher (aapt)
        run: |
          set -euo pipefail
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "${AAPT}" version
          "${AAPT}" dump badging "${APK}" | tee /tmp/ashen-badging.txt
          grep -q "package: name='com.ashenoath.game'" /tmp/ashen-badging.txt
          grep -q "launchable-activity: name='com.ashenoath.game.AshenOathSDLActivity'" /tmp/ashen-badging.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ashen-Oath-Android-APK
          path: ${{ env.APK }}
          if-no-files-found: error
